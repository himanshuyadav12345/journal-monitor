name: Journal Monitor

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      populate_notion:
        description: "Populate Notion with all current journal records (one-time baseline)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: journal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run journal monitor
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_BASELINE: ${{ inputs.populate_notion }}
          NOTION_DATA_SOURCE_ID: "3e264599-6a8c-80a0-9550-000b851d0067"
        run: python -m monitor.main
      - name: Commit updated state and output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json output/latest.json output/latest.csv
          git diff --cached --quiet || git commit -m "Update journal monitor results"
          git push
